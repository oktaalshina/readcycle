<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline | Readcycle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <header class="shadow-sm main-header">
        <div class="container text-center">
            <h1 class="brand-header mb-0">READCYCLE</h1>
        </div>
    </header>

    <main class="flex-grow-1 py-4">
        <div class="container">
            <div class="row">

                <!-- SIDEBAR -->
                 <aside class="col-md-4 mb-2">
                    <div class="p-3 bg-white rounded shadow-sm">
                        <h5 class="fw-bold"> Hello, @username!</h5>
                        <hr>
                        <ul class="nav flex-column">
                            <li class="nav-item">
                                <a class="nav-link text-dark " href="index.html">Home</a>
                            </li>
                            <!-- <li class="nav-item">
                                <a class="nav-link text-dark" href="#" onclick="unavailable()">Profile</a>
                            </li> -->
                            <li class="nav-item">
                                <a class="nav-link text-danger" href="#" onclick="unavailable()">Logout</a>
                            </li>
                        </ul>
                    </div>
                 </aside>

                 <!-- CONTENT -->
                  <div class="col-md-8">

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <input id="searchInput" class="form-control me-2" placeholder="Cari..." type="text">
                        <button class="btn btn-deco" onclick="window.location.href='posting.html';">Posting</button>
                    </div>
                    
                    <!-- DROPDOWN GENRE -->
                    <div class="d-flex gap-2 mb-4">
                        <select class="form-select form-select-form" id="genreFilter">
                            <option value="">Pilih Genre</option>
                        </select>
                        <select class="form-select form-select-form" id="provinceFilter">
                            <option value="">Pilih Lokasi</option>
                        </select>
                    </div>

                    <!-- LIST BUKU -->
                     <div id="book-list"></div>

                     <!-- PAGINATION -->
                      <nav class="mt-4">
                        <ul id="pagination" class="pagination justify-content-center"></ul>
                      </nav>
                  </div>
            </div>
        </div>
    </main>

    <footer class="footer px-3 py-3 text-center">
        <small>© 2025 READCYCLE</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/timeline.js"></script>
    <script>
        function unavailable() {
            alert("Fitur ini tidak tersedia pada live demo.");
        }
    </script>
</body>
</html>
