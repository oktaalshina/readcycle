<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posting Buku | Readcycle</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Rubik&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/posting.css">
</head>
<body class="posting-page d-flex flex-column min-vh-100">
    <header class="shadow-sm main-header">
        <div class="container text-center">
            <h1 class="brand-header mb-0">READCYCLE</h1>
        </div>
    </header>
    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="row">
                <!-- LEFT SIDE -->
                 <div class="col-md-5 d-flex flex-column">
                    <label class="form-label">Pilih Foto *</label>
                    
                    <div class="file-upload-area flex-grow-1" onclick="document.getElementById('imageInput').click()">
                        <input type="file" id="imageInput" accept="image/*">
                        <div id="preview">📷 Klik untuk pilih foto atau drag and drop di sini</div>
                    </div>
                 </div>

                 <!-- RIGTH SIDE -->
                  <div class="col-md-7 pt-3 p-md-0">
                    <h2>Posting buku untuk ditukar</h2>
                    <hr>

                    <form id="postingForm">
                        <div class="mb-3">
                            <label class="form-label">Judul *</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Penulis *</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Bahasa *</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Ingin ditukar dengan *</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Deskripsi</label>
                            <textarea class="form-control" rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <div class="col-md">
                                <label class="form-label">Genre *</label>
                                <select id="genreSelect" class="form-select" required>
                                    <option value="">Pilih Genre</option>
                                </select>
                            </div>
                            <div class="col-md">
                                <label class="form-label">Lokasi *</label>
                                <select id="provinceSelect" class="form-select" required>
                                    <option value="">Pilih Lokasi</option>
                                </select>
                            </div>
                            <div class="col-md">
                                <label class="form-label">Kondisi *</label>
                                <select class="form-select" required>
                                    <option>Good</option>
                                    <option>Average</option>
                                    <option>Damaged</option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button class="btn btn-deco">Posting buku</button>
                            <span class="ms-3">
                                Kembali ke timeline?
                                <a href="timeline.html">klik di sini</a>
                            </span>
                        </div>
                    </form>
                  </div>
            </div>
        </div>
    </main>

    <footer class="footer px-3 py-3 text-center">
        <small>© 2025 READCYCLE</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/timeline.js"></script>
    <script>
        function unavailable() {
            alert("Fitur ini tidak tersedia pada live demo.");
        }
    </script>
</body>
</html>
