<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | READCYCLE</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Righteous&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
    <div class="container-fluid px-0 min-vh-100">
        <div class="row g-0 min-vh-100">
            <!-- === LEFT === -->
             <div class="col-md-6 auth-left">
                <img src="assets/gambarBuku.PNG" alt="Ilustrasi Buku">
             </div>
             <!-- === RIGHT === -->
              <div class="col-md-6 auth-right">
                <div class="auth-box">

                    <h1 class="auth-title">Login</h1>
                    <p class="auth-desc">Masuk ke readcycle untuk mulai menukar buku.</p>

                    <form onsubmit="unavailable(); return false;">
                        <div class="mb-3">
                            <label class="form-label">Username atau Email</label>
                            <input type="text" class="form-control" disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="text" class="form-control" disabled>
                        </div>

                        <a class="btn btn-link" onclick="unavailable()">Lupa password?</a>

                        <button class="btn btn-primary w-100">Login</button>
                    </form>

                    <p class="mt-3">
                        Belum punya akun? <a href="register.html">Daftar disini</a>
                    </p>

                    <a href="index.html">← Kembali ke halaman utama</a>

                </div>
              </div>
        </div>
    </div>

    <footer class="footer px-3 py-3 text-center">
        <small>© 2025 READCYCLE</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/timeline.js"></script>
    <script>
        function unavailable() {
            alert("Fitur ini tidak tersedia pada live demo.");
        }
    </script>
    
</body>
</html>
